<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公开面 · 索引</title>
<style>
:root{--paper:#fbf8f3;--ink:#2a2520;--muted:#8d8479;--rule:#e3d9cb;--accent:#a8475e}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:64px 28px}
.kicker{font-size:11px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
h1{font-family:"Songti SC","Noto Serif SC",serif;font-weight:700;font-size:38px;margin:10px 0 6px}
.lead{color:var(--muted);font-size:13px;margin-bottom:26px}
hr{border:0;border-top:2px solid var(--ink);margin:0 0 8px}
ul{list-style:none;padding:0;margin:0}
li a{display:flex;justify-content:space-between;gap:16px;padding:16px 2px;
border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:16px}
li a:hover{color:var(--accent)}
li a span{color:var(--muted);font-size:12px;letter-spacing:.06em}
.foot{margin-top:28px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Public Surface</div>
  <h1>公开面</h1>
  <div class="lead">这里只放主人明确批准公开的文件；其余内容留在私有库。</div>
  <hr>
  <ul>
    <li><a href="sweet-songs.html">sweet-songs.html<span>OPEN</span></a></li>
  </ul>
  <div class="foot">本页与目录内容由 scripts/publish_share 生成，请勿手改；要加文件，改 scripts/share_manifest.txt。</div>
</div>
</body>
</html>
